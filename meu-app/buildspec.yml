version: 0.2

phases:

  pre_build:
    commands:
      - echo Login no ECR
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/dg-ecr

      - aws ecr get-login-password \
        --region $AWS_DEFAULT_REGION \
        | docker login \
        --username AWS \
        --password-stdin $REPOSITORY_URI

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - docker build -t dg-app .
      - docker tag dg-app:latest $REPOSITORY_URI:$IMAGE_TAG
      - docker tag dg-app:latest $REPOSITORY_URI:latest

  post_build:
    commands:
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest

      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":"80"}]}' \
        $REPOSITORY_URI:$IMAGE_TAG \
        > Dockerrun.aws.json

artifacts:
  files:
    - Dockerrun.aws.json